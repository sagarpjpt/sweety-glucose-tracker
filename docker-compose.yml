services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: sweety
      POSTGRES_PASSWORD: sweety_local
      POSTGRES_DB: sweety
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweety"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: postgres://sweety:sweety_local@db:5432/sweety
      # Local HTTP demo. Use production behind HTTPS to enable secure cookies.
      NODE_ENV: development
      APP_TIMEZONE: Asia/Kolkata
      PORT: 3001
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "npm run db:migrate && npm start"]
volumes:
  pgdata:
